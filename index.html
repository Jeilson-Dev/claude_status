<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Usage</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="widget">
      <section class="block">
        <div class="head">
          <span class="label">Current session</span>
          <span class="pct" id="session-pct">—</span>
        </div>
        <div class="track"><div class="fill" id="session-fill"></div></div>
        <div class="sub" id="session-sub">…</div>
      </section>

      <section class="block">
        <div class="head">
          <span class="label">Weekly limits</span>
          <span class="pct" id="weekly-pct">—</span>
        </div>
        <div class="track"><div class="fill" id="weekly-fill"></div></div>
        <div class="sub" id="weekly-sub">…</div>
      </section>
    </main>
  </body>
</html>
